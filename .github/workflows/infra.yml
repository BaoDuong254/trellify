name: Infra

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: v0.8.0
  TERRAFORM_VERSION: 1.16.6

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize and kubeconform
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate manifests
        run: |
          set -o pipefail
          KC="kubeconform -strict -summary -output text -kubernetes-version 1.34.0 -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          for dir in $(find infra -name kustomization.yaml -not -path '*/.terraform/*' -exec dirname {} \; | sort); do
            echo "::group::$dir"
            kustomize build "$dir" | $KC -
            echo "::endgroup::"
          done
          $KC infra/clusters/homelab/bootstrap/*.yaml infra/apps/trellify/jobs/*.yaml

      - name: Scan IaC misconfigurations
        run: docker run --rm -v "$PWD/infra:/infra:ro" aquasec/trivy:0.69.3 config --severity HIGH,CRITICAL --exit-code 0 /infra

  terraform:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        stack: [bootstrap, cloudflare, cluster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format
        run: terraform -chdir=infra/clusters/aws/terraform/${{ matrix.stack }} fmt -check -diff

      - name: Validate
        run: |
          terraform -chdir=infra/clusters/aws/terraform/${{ matrix.stack }} init -backend=false -input=false
          terraform -chdir=infra/clusters/aws/terraform/${{ matrix.stack }} validate

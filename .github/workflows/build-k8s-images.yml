name: Build k8s Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: baoduong254
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Compute immutable tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect app changes since the deployed image
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(git show origin/main:infra/trellify/overlays/prod/kustomization.yaml | sed -n 's/^ *newTag: sha-//p' | head -n1)
          if [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "Deployed commit unknown, building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app_files=$(git diff --name-only "$deployed" HEAD -- . ':(exclude)infra' ':(exclude)*.md')
          if [ -z "$app_files" ]; then
            echo "Nothing outside infra/ and *.md changed since sha-$deployed, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.changed == 'true'

      - name: Login to GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        id: build-server
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          sbom: true
          provenance: mode=max
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        id: build-client
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          sbom: true
          provenance: mode=max
          context: .
          file: ./apps/client/Dockerfile
          push: true
          build-args: |
            VITE_API_ENDPOINT=
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            SENTRY_RELEASE=${{ steps.vars.outputs.tag }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan server image for fixable critical CVEs
        if: steps.changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server@${{ steps.build-server.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report server image CVEs
        if: always() && steps.build-server.outputs.digest != ''
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server@${{ steps.build-server.outputs.digest }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-server.sarif
          exit-code: "0"

      - name: Upload server scan to code scanning
        if: always() && steps.build-server.outputs.digest != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-server.sarif
          ref: ${{ github.ref }}
          sha: ${{ env.SOURCE_SHA }}
          category: trivy-server

      - name: Scan client image for fixable critical CVEs
        if: steps.changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client@${{ steps.build-client.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report client image CVEs
        if: always() && steps.build-client.outputs.digest != ''
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client@${{ steps.build-client.outputs.digest }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-client.sarif
          exit-code: "0"

      - name: Upload client scan to code scanning
        if: always() && steps.build-client.outputs.digest != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-client.sarif
          ref: ${{ github.ref }}
          sha: ${{ env.SOURCE_SHA }}
          category: trivy-client

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changes.outputs.changed == 'true'

      - name: Sign images
        if: steps.changes.outputs.changed == 'true'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server@${{ steps.build-server.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client@${{ steps.build-client.outputs.digest }}

      - name: Notify Telegram that the build or scan blocked the deploy
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=⛔ Image build or CVE scan failed, nothing deployed.
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  bump-manifest:
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITOPS_TOKEN || github.token }}

      - name: Install kustomize
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Pin new image tags
        working-directory: infra/trellify/overlays/prod
        run: |
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server=${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ needs.build-and-push.outputs.tag }} \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client=${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client:${{ needs.build-and-push.outputs.tag }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -am "chore(deploy): trellify -> ${{ needs.build-and-push.outputs.tag }} [skip ci]"
          git push

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=🚀 Image k3s build successful.
          🏷️ Tag: ${{ needs.build-and-push.outputs.tag }}
          📦 ghcr.io/${{ env.OWNER }}/trellify-{server,client}
          👀 ArgoCD will sync automatically
          🔗 https://github.com/${{ github.repository }}/commit/${{ env.SOURCE_SHA }}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=❌ Build image k3s failed.
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify-blocked:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Telegram that CI blocked the deploy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=⛔ CI failed on main, image not built or deployed.
          🔗 ${{ github.event.workflow_run.html_url }}"

name: Build k8s Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/trellify/overlays/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: baoduong254

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute immutable tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: true
          build-args: |
            VITE_API_ENDPOINT=
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITOPS_TOKEN || github.token }}

      - name: Install kustomize
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Pin new image tags
        working-directory: infra/trellify/overlays/prod
        run: |
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server=${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ needs.build-and-push.outputs.tag }} \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client=${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-client:${{ needs.build-and-push.outputs.tag }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -am "chore(deploy): trellify -> ${{ needs.build-and-push.outputs.tag }} [skip ci]"
          git push

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Image k3s build successful.
            🏷️ Tag: ${{ needs.build-and-push.outputs.tag }}
            📦 ghcr.io/${{ env.OWNER }}/trellify-{server,client}
            👀 ArgoCD will sync automatically
            🔗 https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Build image k3s failed.
            🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

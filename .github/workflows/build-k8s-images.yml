name: Build k8s Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: baoduong254
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.build-server.outputs.digest }}
      sha: ${{ steps.vars.outputs.sha }}
      deployed_tag: ${{ steps.deployed.outputs.tag }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Read the deployed image tag
        id: deployed
        shell: bash
        run: |
          tag=$(git show origin/main:infra/apps/trellify/overlays/prod/kustomization.yaml | sed -n 's/^ *newTag: //p' | head -n1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "$tag" | sed -n 's/^sha-\([0-9a-f]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Check out the deployed commit for a scheduled rebuild
        if: github.event_name == 'schedule'
        run: git checkout --quiet "${{ steps.deployed.outputs.commit }}"

      - name: Compute immutable tag
        id: vars
        shell: bash
        run: |
          short=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=sha-$short" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$short-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "apk_upgrade_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Detect app changes since the deployed image
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            set +e
            docker run --rm aquasec/trivy:0.69.3 image --quiet --scanners vuln --pkg-types os \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 3 \
              "${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ steps.deployed.outputs.tag }}"
            rc=$?
            set -e
            if [ "$rc" -eq 3 ]; then
              echo "trellify-server has fixable HIGH/CRITICAL CVEs, rebuilding."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$rc" -ne 0 ]; then
              echo "Trivy failed on trellify-server (exit $rc)."
              exit "$rc"
            fi
            echo "Deployed image has no fixable HIGH/CRITICAL CVEs, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed="${{ steps.deployed.outputs.commit }}"
          if [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "Deployed commit unknown, building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app_files=$(git diff --name-only "$deployed" HEAD -- . ':(exclude)infra' ':(exclude)*.md')
          if [ -z "$app_files" ]; then
            echo "Nothing outside infra/ and *.md changed since sha-$deployed, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.changes.outputs.changed == 'true'

      - name: Login to GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        id: build-server
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          sbom: true
          provenance: mode=max
          context: .
          file: ./apps/server/Dockerfile
          push: true
          build-args: |
            APK_UPGRADE_DATE=${{ steps.vars.outputs.apk_upgrade_date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan server image for fixable critical CVEs
        if: steps.changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server@${{ steps.build-server.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report server image CVEs
        if: always() && steps.build-server.outputs.digest != ''
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server@${{ steps.build-server.outputs.digest }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-server.sarif
          exit-code: "0"

      - name: Upload server scan to code scanning
        if: always() && steps.build-server.outputs.digest != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-server.sarif
          ref: ${{ github.ref }}
          sha: ${{ steps.vars.outputs.sha }}
          category: trivy-server

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changes.outputs.changed == 'true'

      - name: Sign image
        if: steps.changes.outputs.changed == 'true'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server@${{ steps.build-server.outputs.digest }}

      - name: Notify Telegram that the build or scan blocked the deploy
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=⛔ Image build or CVE scan failed, nothing deployed.
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  bump-manifest:
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.changed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITOPS_TOKEN || github.token }}

      - name: Install kustomize
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Pin new image tag and digest
        id: pin
        working-directory: infra/apps/trellify/overlays/prod
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          if ! echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not report a digest ('$DIGEST'), refusing to pin by tag alone."
            exit 1
          fi
          current=$(sed -n 's/^ *newTag: //p' kustomization.yaml | head -n1)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$current" != "${{ needs.build-and-push.outputs.deployed_tag }}" ]; then
            echo "Overlay moved to $current while rebuilding ${{ needs.build-and-push.outputs.deployed_tag }}, not rolling it back."
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kustomize edit set image \
            "${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server=${{ env.REGISTRY }}/${{ env.OWNER }}/trellify-server:${{ needs.build-and-push.outputs.tag }}@${DIGEST}"
          echo "pinned=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.pin.outputs.pinned == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -am "chore(deploy): trellify -> ${{ needs.build-and-push.outputs.tag }} [skip ci]"
          git push

      - name: Notify Telegram on success
        if: success() && steps.pin.outputs.pinned == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=🚀 Image k3s build successful.
          🏷️ Tag: ${{ needs.build-and-push.outputs.tag }}
          📦 ghcr.io/${{ env.OWNER }}/trellify-server
          👀 ArgoCD will sync automatically
          🔗 https://github.com/${{ github.repository }}/commit/${{ needs.build-and-push.outputs.sha }}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=❌ Build image k3s failed.
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-client:
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.changed == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-client
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm pkg:build

      - name: Build client
        run: pnpm fe apps:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_ENDPOINT: https://trellify-api.duonggiabao.com
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.build-and-push.outputs.tag }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/client
        run: npx --yes --ignore-scripts wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_TO}"             --data-urlencode "text=❌ Client deploy to Cloudflare failed.
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify-blocked:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Notify Telegram that CI blocked the deploy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=⛔ CI failed on main, image not built or deployed.
          🔗 ${{ github.event.workflow_run.html_url }}"

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for server build
        run: echo "${{ secrets.SERVER_ENV }}" > apps/server/.env

      - name: Create .env for client build
        run: echo "${{ secrets.CLIENT_ENV }}" > apps/client/.env

      # - name: Generate Prisma client
      #   run: pnpm --filter server exec prisma generate

      - name: Run lint
        run: pnpm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run knip
        run: pnpm run knip

      - name: Run knip (production)
        run: pnpm run knip:production

      - name: Run format check
        run: pnpm run format

      - name: Check CSP script hashes
        run: bash scripts/check-csp-hashes.sh

      - name: Build packages
        run: pnpm run pkg:build

      - name: Type check
        run: pnpm run typecheck

      - name: Build apps
        run: pnpm run apps:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run unit and integration tests
        run: pnpm run test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run pkg:build

      - name: Install Playwright browser
        run: pnpm e2e exec playwright install --with-deps chromium

      - name: Start MongoDB and Redis
        run: pnpm run e2e:up

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop MongoDB and Redis
        if: always()
        run: pnpm run e2e:down

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for server build
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: printf '%s\n' "$SERVER_ENV" > apps/server/.env

      - name: Create .env for client build
        env:
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: printf '%s\n' "$CLIENT_ENV" > apps/client/.env

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high --ignore-unfixable --ignore-registry-errors

      - name: Run lint
        run: pnpm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run knip
        run: pnpm run knip

      - name: Run knip (production)
        run: pnpm run knip:production

      - name: Run format check
        run: pnpm run format

      - name: Check CSP script hashes
        run: bash scripts/check-csp-hashes.sh

      - name: Build packages
        run: pnpm run pkg:build

      - name: Type check
        run: pnpm run typecheck

      - name: Build apps
        run: pnpm run apps:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run unit and integration tests
        run: pnpm run test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run pkg:build

      - name: Install Playwright browser
        run: pnpm e2e exec playwright install --with-deps chromium

      - name: Start MongoDB and Redis
        run: pnpm run e2e:up

      - name: Run Playwright
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Start API for ZAP
        continue-on-error: true
        run: |
          pnpm --filter=server exec tsx --env-file=../../e2e/e2e.env src/index.ts &
          timeout 120 bash -c 'until curl -fsS http://localhost:3100/api/v1/status > /dev/null; do sleep 2; done'

      - name: ZAP baseline scan
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3100/api/v1/status
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report

      - name: Stop MongoDB and Redis
        if: always()
        run: pnpm run e2e:down

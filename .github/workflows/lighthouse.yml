name: Lighthouse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UNLIGHTHOUSE_SITE: https://trellify.duonggiabao.com

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan public pages
        run: pnpm run lighthouse:ci

      - name: Refresh access token
        id: refresh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REFRESH_TOKEN: ${{ secrets.UNLIGHTHOUSE_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::Secret UNLIGHTHOUSE_REFRESH_TOKEN is not set"
            exit 1
          fi
          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
            --cookie "refreshToken=$REFRESH_TOKEN" \
            "$UNLIGHTHOUSE_SITE/api/v1/users/refresh_token")
          if [ "$status" = "403" ] && grep -q "Please login again" "$body"; then
            echo "::error::Refresh token expired. Log in to the test account again and update the UNLIGHTHOUSE_REFRESH_TOKEN secret."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Refresh token request returned HTTP $status (possibly a Cloudflare challenge)"
            head -c 500 "$body"
            exit 1
          fi
          access_token=$(grep -i '^set-cookie: accessToken=' "$headers" | head -n1 | sed -E 's/^[^=]*=([^;]*).*/\1/' | tr -d '\r')
          if [ -z "$access_token" ]; then
            echo "::error::Refresh token response did not set an accessToken cookie"
            exit 1
          fi
          echo "::add-mask::$access_token"
          echo "UNLIGHTHOUSE_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"

      - name: Scan authenticated pages
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        run: pnpm run lighthouse:ci
        env:
          UNLIGHTHOUSE_REFRESH_TOKEN: ${{ secrets.UNLIGHTHOUSE_REFRESH_TOKEN }}
          UNLIGHTHOUSE_PERSIST_ROOT: ${{ secrets.UNLIGHTHOUSE_PERSIST_ROOT }}
          UNLIGHTHOUSE_BOARD_ID: ${{ secrets.UNLIGHTHOUSE_BOARD_ID }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unlighthouse-report
          path: .unlighthouse
          retention-days: 14

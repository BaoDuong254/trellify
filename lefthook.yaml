pre-commit:
  commands:
    check-lockfile:
      run: bash scripts/check-lockfile.sh

    check-csp-hashes:
      run: bash scripts/check-csp-hashes.sh

    knip:
      glob: "*"
      run: pnpm knip

    format:
      glob: "*"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    lint:
      glob: "**/*.{js,ts,jsx,tsx}"
      run: pnpm lint:fix
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

post-commit:
  commands:
    success-message:
      run: |
        git update-index --again
        echo "⬆️ Commit successfully made!"
        echo "🚀 Don't forget to push your changes!"

fullnameOverride: kps

alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-telegram
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path-retain
          resources:
            requests:
              storage: 1Gi
  config:
    route:
      group_by: [alertname, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - matchers:
            - service = "trellify"
          receiver: telegram
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
            send_resolved: true
            parse_mode: ""
            message: |-
              {{ .Status | toUpper }} - {{ .Alerts | len }} alert(s)
              {{ range .Alerts }}
              [{{ .Labels.severity }}] {{ .Labels.alertname }}
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    retention: 7d
    retentionSize: 15GB
    scrapeInterval: 60s
    evaluationInterval: 60s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1280Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path-retain
          resources:
            requests:
              storage: 20Gi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: Asia/Ho_Chi_Minh
  persistence:
    enabled: true
    storageClassName: local-path-retain
    size: 2Gi
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi
  env:
    GOGC: "50"
  grafana.ini:
    dataproxy:
      response_limit: "52428800"

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 64Mi

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster-autoscaler
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: cluster-autoscaler
      targetRevision: 9.59.0
      helm:
        releaseName: cluster-autoscaler
        valueFiles:
          - $values/infra/clusters/aws/cluster-autoscaler/values.yaml
    - repoURL: https://github.com/BaoDuong254/trellify.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

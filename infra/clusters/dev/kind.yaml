kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trellify
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        listenAddress: "127.0.0.1"
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        listenAddress: "127.0.0.1"
        hostPort: 443
        protocol: TCP

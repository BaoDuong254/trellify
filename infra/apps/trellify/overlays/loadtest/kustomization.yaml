apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../dev

configMapGenerator:
  - name: trellify-server-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - WRITE_RATE_LIMIT_PER_MINUTE=10000000

patches:
  - target:
      kind: Deployment
      name: trellify-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 256Mi }
  - target:
      kind: Deployment
      name: trellify-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: ["node", "dist/worker.js"]
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 160Mi }
          limits: { memory: 160Mi }

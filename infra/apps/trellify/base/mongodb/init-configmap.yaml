apiVersion: v1
kind: ConfigMap
metadata:
  name: trellify-mongodb-init
data:
  01-create-app-user.sh: |
    #!/bin/sh
    set -e
    mongosh --quiet \
      -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" \
      --authenticationDatabase admin \
      --eval "db.getSiblingDB('admin').createUser({
        user: '$MONGO_APP_USERNAME',
        pwd:  '$MONGO_APP_PASSWORD',
        roles: [{ role: 'readWrite', db: '$MONGO_APP_DB' }]
      })"
    echo "Created application user $MONGO_APP_USERNAME with readWrite on $MONGO_APP_DB"

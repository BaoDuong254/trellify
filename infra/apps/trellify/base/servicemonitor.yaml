apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trellify
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [trellify-server, trellify-worker]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trellify-mongodb
spec:
  selector:
    matchLabels:
      app: trellify-mongodb
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s

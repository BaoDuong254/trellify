controller:
  replicaCount: 1

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  service:
    type: LoadBalancer

  config:
    enable-real-ip: "true"
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    forwarded-for-header: "CF-Connecting-IP"
    proxy-real-ip-cidr: "10.42.0.0/16"
    proxy-body-size: "12m"

    use-gzip: "true"
    gzip-types: "text/plain text/css text/xml text/javascript application/javascript application/json"

    server-tokens: "false"

    ssl-redirect: "false"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 192Mi

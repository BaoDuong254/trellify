apiVersion: v1
kind: Service
metadata:
  name: trellify-redis-headless
spec:
  clusterIP: None
  selector:
    app: trellify-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: trellify-redis
spec:
  selector:
    app: trellify-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

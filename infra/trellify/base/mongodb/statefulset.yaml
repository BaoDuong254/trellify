apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trellify-mongodb
spec:
  serviceName: trellify-mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app: trellify-mongodb
  template:
    metadata:
      labels:
        app: trellify-mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mongod
          image: mongo:8.0
          args:
            - "--bind_ip_all"
            - "--auth"
            - "--wiredTigerCacheSizeGB"
            - "0.5"
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: trellify-mongodb-auth, key: root-username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: trellify-mongodb-auth, key: root-password } }
            - name: MONGO_APP_USERNAME
              valueFrom: { secretKeyRef: { name: trellify-mongodb-auth, key: username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: trellify-mongodb-auth, key: password } }
            - name: MONGO_APP_DB
              value: "trellify"
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: exporter
          image: percona/mongodb_exporter:0.53.0
          args:
            - "--web.listen-address=:9216"
            - "--collector.diagnosticdata"
            - "--collector.dbstats"
            - "--compatible-mode"
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: trellify-mongodb-auth, key: root-username } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: trellify-mongodb-auth, key: root-password } }
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@127.0.0.1:27017/?authSource=admin&directConnection=true"
          ports:
            - name: metrics
              containerPort: 9216
          readinessProbe:
            httpGet: { path: /, port: metrics }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: trellify-mongodb-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 20Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trellify-server
  labels:
    app: trellify-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trellify-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: trellify-server
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: trellify-server
      containers:
        - name: server
          image: ghcr.io/baoduong254/trellify-server
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: trellify-server-config
            - secretRef:
                name: trellify-server-secrets
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

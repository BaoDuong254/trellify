apiVersion: apps/v1
kind: Deployment
metadata:
  name: trellify-worker
  labels:
    app: trellify-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trellify-worker
  template:
    metadata:
      labels:
        app: trellify-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/baoduong254/trellify-server
          command: ["node", "dist/worker.js"]
          ports:
            - name: health
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: trellify-server-config
            - secretRef:
                name: trellify-server-secrets
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trellify-redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@trellify-redis:6379"
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

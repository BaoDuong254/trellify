apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trellify

resources:
  - namespace.yaml
  - deployment-server.yaml
  - deployment-worker.yaml
  - deployment-client.yaml
  - services.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa-server.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - redis/statefulset.yaml
  - redis/services.yaml
  - mongodb/init-configmap.yaml
  - mongodb/statefulset.yaml
  - mongodb/services.yaml
  - mongodb/backup-cronjob.yaml

configMapGenerator:
  - name: trellify-server-config
    envs:
      - config-server.env
  - name: trellify-redis-config
    files:
      - redis.conf=redis/redis.conf

labels:
  - pairs:
      app.kubernetes.io/part-of: trellify
    includeSelectors: false

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trellify
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Trellify Application (app + MongoDB + Redis)
  sourceRepos:
    - https://github.com/BaoDuong254/trellify.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: trellify
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

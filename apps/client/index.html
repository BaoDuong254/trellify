<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/trello.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/roboto-latin-wght-normal.woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Roboto Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/roboto-latin-wght-normal.woff2) format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Roboto Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/roboto-vietnamese-wght-normal.woff2) format("woff2-variations");
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304,
          U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }

      @font-face {
        font-family: "Roboto Metrics Fallback";
        src: local("Arial");
        ascent-override: 92.77%;
        descent-override: 24.41%;
        line-gap-override: 0%;
      }

      #auth-bg,
      #auth-skeleton {
        display: none;
      }

      html.auth-shell #auth-bg {
        display: block;
        position: fixed;
        inset: 0;
        z-index: -2;
        background-color: #1565c0;
        background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url(/images/login-bg-mobile.webp);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }
      @media (min-width: 601px) {
        html.auth-shell #auth-bg {
          background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url(/images/login-bg.webp);
        }
      }

      html.auth-shell {
        --auth-paper: #fff;
        --auth-accent: #1976d2;
        --auth-text-secondary: rgba(0, 0, 0, 0.6);
        --auth-placeholder: rgba(0, 0, 0, 0.08);
      }
      html.auth-shell[data-mui-color-scheme="dark"] {
        --auth-paper: #121212;
        --auth-accent: #90caf9;
        --auth-text-secondary: rgba(255, 255, 255, 0.7);
        --auth-placeholder: rgba(255, 255, 255, 0.09);
      }

      html.auth-shell:not(.app-ready) #auth-skeleton {
        display: block;
        position: fixed;
        top: 96px;
        left: 50%;
        transform: translateX(-50%);
        z-index: -1;
        width: 380px;
        max-width: calc(100% - 32px);
        overflow: hidden;
        border-radius: 4px;
        background-color: var(--auth-paper);
        box-shadow:
          0 2px 1px -1px rgba(0, 0, 0, 0.2),
          0 1px 1px 0 rgba(0, 0, 0, 0.14),
          0 1px 3px 0 rgba(0, 0, 0, 0.12);
      }
      #auth-skeleton .sk-avatars {
        margin: 16px;
        height: 40px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      #auth-skeleton .sk-avatars span {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: var(--auth-accent);
      }
      #auth-skeleton .sk-author {
        margin: 16px 0 0;
        font-family: "Roboto Variable", "Roboto Metrics Fallback", "Arial", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        text-align: center;
        color: var(--auth-text-secondary);
      }
      #auth-skeleton .sk-bar {
        border-radius: 4px;
        background-color: var(--auth-placeholder);
      }
      #auth-skeleton .sk-field {
        margin: 16px 16px 0;
        height: 56px;
      }
      #auth-skeleton .sk-link {
        margin: 8px 16px 0 auto;
        width: 110px;
        height: 20px;
      }
      #auth-skeleton .sk-widget {
        margin: 16px auto 8px;
        width: 300px;
        max-width: calc(100% - 32px);
        height: 65px;
      }
      #auth-skeleton .sk-action {
        margin: 0 16px;
        height: 42px;
      }
      #auth-skeleton .sk-foot {
        margin: 16px auto 0;
        width: 150px;
        height: 21px;
      }
      #auth-skeleton .sk-foot-link {
        margin: 4px auto 16px;
        width: 120px;
        height: 21px;
      }
    </style>

    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />

    <script>
      try {
        var muiMode = localStorage.getItem("mui-mode") || "system";
        var muiScheme =
          muiMode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : muiMode;
        document.documentElement.setAttribute("data-mui-color-scheme", muiScheme);
      } catch (e) {}
      if (/^\/(login|register|forgot-password|reset-password)\b/.test(location.pathname)) {
        document.documentElement.className = "auth-shell";
        var isNarrow = window.matchMedia("(max-width: 600px)").matches;
        var bg = document.createElement("link");
        bg.rel = "preload";
        bg.as = "image";
        bg.href = isNarrow ? "/images/login-bg-mobile.webp" : "/images/login-bg.webp";
        bg.fetchPriority = "high";
        document.head.appendChild(bg);
      }
    </script>

    <!-- Primary Meta Tags -->
    <title>Trellify</title>
    <meta name="title" content="Trellify" />
    <meta
      name="description"
      content="A collaborative platform featuring real-time collaboration, drag-and-drop Kanban boards, and shared team workspaces."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trellify.duonggiabao.com/" />
    <meta property="og:title" content="Trellify" />
    <meta
      property="og:description"
      content="A collaborative platform featuring real-time collaboration, drag-and-drop Kanban boards, and shared team workspaces."
    />
    <meta property="og:image" content="https://trellify.duonggiabao.com/images/meta.jpg" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://trellify.duonggiabao.com/" />
    <meta property="twitter:title" content="Trellify" />
    <meta
      property="twitter:description"
      content="A collaborative platform featuring real-time collaboration, drag-and-drop Kanban boards, and shared team workspaces."
    />
    <meta property="twitter:image" content="https://trellify.duonggiabao.com/images/meta.jpg" />

    <!-- Meta Tags Generated with https://metatags.io -->
    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-74LRZSSQ4W");

      addEventListener("load", function () {
        var loadGtag = function () {
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-74LRZSSQ4W";
          document.head.appendChild(s);
        };
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadGtag, { timeout: 3000 });
        } else {
          setTimeout(loadGtag, 1000);
        }
      });
    </script>
  </head>
  <body>
    <div id="auth-bg"></div>
    <div id="auth-skeleton" aria-hidden="true">
      <div class="sk-avatars"><span></span><span></span></div>
      <p class="sk-author">Author: BaoGiaDuong</p>
      <div class="sk-bar sk-field"></div>
      <div class="sk-bar sk-field"></div>
      <div class="sk-bar sk-link"></div>
      <div class="sk-bar sk-widget"></div>
      <div class="sk-bar sk-action"></div>
      <div class="sk-bar sk-foot"></div>
      <div class="sk-bar sk-foot-link"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

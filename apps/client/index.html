<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/trello.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      if (/^\/(login|register|forgot-password|reset-password)\b/.test(location.pathname)) {
        var bg = document.createElement("link");
        bg.rel = "preload";
        bg.as = "image";
        bg.href = "/login-bg.webp";
        bg.fetchPriority = "high";
        document.head.appendChild(bg);
      }
    </script>

    <!-- Primary Meta Tags -->
    <title>Trellify</title>
    <meta name="title" content="Trellify" />
    <meta
      name="description"
      content="A collaborative platform featuring real-time collaboration, drag-and-drop Kanban boards, and shared team workspaces."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trellify.duonggiabao.com/" />
    <meta property="og:title" content="Trellify" />

      property="og:description"
      content="A collaborative platform featuring real-time collaboration, drag-and-drop Kanban boards, and shared team workspaces."
    />
    <meta property="og:image" content="https://trellify.duonggiabao.com/meta.jpg" />
